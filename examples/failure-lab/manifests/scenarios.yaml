---
# ── DATA-PIPELINE namespace ───────────────────────────────────────
# 1 OOMKilled (stress container with low memory limit)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-processor
  namespace: data-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stream-processor
  template:
    metadata:
      labels:
        app: stream-processor
    spec:
      containers:
      - name: stress
        image: polinux/stress
        command: ["stress"]
        args: ["--vm", "1", "--vm-bytes", "150M", "--vm-hang", "1"]
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch-importer
  namespace: data-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: batch-importer
  template:
    metadata:
      labels:
        app: batch-importer
    spec:
      containers:
      - name: app
        image: company-registry.internal/batch-importer:v3.0.1
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"
