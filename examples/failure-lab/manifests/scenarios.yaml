apiVersion: v1
kind: Namespace
metadata:
  name: payments
  labels:
    opscart.io/failure-lab: "true"

---
apiVersion: v1
kind: Namespace
metadata:
  name: inventory
  labels:
    opscart.io/failure-lab: "true"

---
