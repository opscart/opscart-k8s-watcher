apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opscart-watcher.fullname" . }}
  namespace: {{ include "opscart-watcher.namespace" . }}
  labels:
    {{- include "opscart-watcher.labels" . | nindent 4 }}
spec:
  replicas: 1
  {{- if .Values.persistence.enabled }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "opscart-watcher.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "opscart-watcher.selectorLabels" . | nindent 8 }}
        {{- if .Values.azureBilling.workloadIdentity.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ include "opscart-watcher.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.volumePermissions.enabled }}
      initContainers:
        - name: volume-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 65534:65534 /data"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: opscart-data
              mountPath: /data
      {{- end }}
      containers:
        - name: dashboard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- toYaml .Values.args | nindent 12 }}
          env:
            - name: OPSCART_DB_PATH
              value: /data/opscart.db
            {{- if .Values.persistence.enabled }}
            - name: OPSCART_PERSISTENCE_REQUIRED
              value: "true"
            {{- end }}
            - name: OPSCART_RETENTION_DAYS
              value: {{ .Values.retentionDays | quote }}
            - name: OPSCART_LOGS_ENABLED
              value: {{ .Values.logs.enabled | quote }}
            - name: OPSCART_AUTH_SECRET_NAME
              value: {{ include "opscart-watcher.authSecretName" . | quote }}
            {{- if .Values.ai.enabled }}
            - name: OPSCART_AI_ENABLED
              value: "true"
            - name: OPSCART_AI_PROVIDER
              value: {{ .Values.ai.provider | quote }}
            - name: OPSCART_AI_BASE_URL
              value: {{ .Values.ai.baseURL | quote }}
            - name: OPSCART_AI_MODEL
              value: {{ required "ai.model is required when AI is enabled" .Values.ai.model | quote }}
            - name: OPSCART_AI_TIMEOUT
              value: {{ .Values.ai.timeout | quote }}
            - name: OPSCART_AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "ai.existingSecret is required when AI is enabled" .Values.ai.existingSecret | quote }}
                  key: {{ .Values.ai.apiKeyKey | quote }}
            {{- end }}
            {{- if .Values.azureBilling.enabled }}
            - name: OPSCART_AZURE_BILLING_CONFIG
              value: {{ .Values.azureBilling.configPath | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: opscart-data
              mountPath: /data
            - name: auth-secret
              mountPath: /etc/opscart/auth
              readOnly: true
            {{- if .Values.azureBilling.enabled }}
            - name: azure-billing-config
              mountPath: {{ .Values.azureBilling.configPath }}
              subPath: azure-billing.yaml
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: opscart-data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "opscart-watcher.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: auth-secret
          secret:
            secretName: {{ include "opscart-watcher.authSecretName" . }}
        {{- if .Values.azureBilling.enabled }}
        - name: azure-billing-config
          configMap:
            name: {{ include "opscart-watcher.azureBillingConfigMapName" . }}
        {{- end }}
