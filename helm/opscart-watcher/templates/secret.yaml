{{- if not .Values.auth.existingSecret }}
{{- $secretName := include "opscart-watcher.authSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $username := .Values.auth.username | default "admin" }}
{{- $password := randAlphaNum 32 }}
{{- if $existing }}
{{- $username = index $existing.data "username" | b64dec }}
{{- $password = index $existing.data "password" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "opscart-watcher.namespace" . }}
  labels:
    {{- include "opscart-watcher.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ $username | b64enc | quote }}
  password: {{ $password | b64enc | quote }}
{{- end }}
