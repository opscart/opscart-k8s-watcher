# Default values for opscart-watcher.

image:
  repository: ghcr.io/opscart/opscart-dashboard
  tag: "v1.16.0"
  # For local development with a locally-built image (e.g. minikube):
  # the image must be loaded under the EXACT repository:tag rendered by
  # this chart — kubelet does no fuzzy matching with pullPolicy Never.
  #   docker build -t ghcr.io/opscart/opscart-dashboard:dev .
  #   minikube image load ghcr.io/opscart/opscart-dashboard:dev
  #   helm upgrade ... --set image.tag=dev --set image.pullPolicy=Never
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: opscart-dashboard
  # Required for Azure Workload Identity when azureBilling.enabled is true:
  # azure.workload.identity/client-id: "<the workload identity's client ID>"
  # See docs/09-Azure-Billing.md for the full federated-credential setup.
  annotations: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

persistence:
  enabled: true
  size: 1Gi
  storageClassName: ""   # empty = cluster default
  existingClaim: ""      # use a pre-created PVC instead of templating one

retentionDays: 90   # resolved incidents/events older than this are pruned each scan cycle; 0 = keep forever

logs:
  # Live, bounded current/previous container log preview on Investigation pages.
  # Set false to disable the preview and remove pods/log RBAC.
  enabled: true

ai:
  # Manual War Room AI analysis only; no analysis is triggered automatically.
  enabled: false
  provider: openai
  baseURL: https://api.openai.com/v1
  model: ""                  # required when enabled
  timeout: 30s
  existingSecret: ""         # required when enabled; Secret is managed outside this chart
  apiKeyKey: api-key          # key within existingSecret

azureBilling:
  # Real Azure Cost Management billing, disabled by default. See
  # docs/09-Azure-Billing.md for the required Azure permissions, Workload
  # Identity federated-credential setup, and how to reconcile figures
  # against the Azure Portal.
  enabled: false
  # Path inside the container where the billing config (pkg/billing.Config
  # YAML: per-cluster subscription/AKS resource identity, cost basis,
  # reporting period, refresh interval) is mounted. Only meaningful when
  # enabled is true.
  configPath: /etc/opscart/azure-billing.yaml
  # Raw YAML content for the billing config, rendered into a ConfigMap and
  # mounted read-only at configPath. Contains no secrets — only Azure
  # resource identifiers and reporting settings. Example:
  #   clusters:
  #     - cluster: my-context
  #       enabled: true
  #       authMode: workload-identity   # or azure-cli for local dashboard use; no default, no fallback between them
  #       subscriptionId: "<subscription-id>"
  #       aksResourceId: "/subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.ContainerService/managedClusters/<name>"
  config: ""
  workloadIdentity:
    # Adds the azure.workload.identity/use: "true" pod label AKS's Workload
    # Identity webhook requires to inject the federated token volume.
    # serviceAccount.annotations must also carry
    # azure.workload.identity/client-id for authentication to actually
    # succeed — this chart never sets that annotation itself.
    enabled: false

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

args:
  - "--port=8080"
  - "--breakdown=deployment"

auth:
  username: "admin"        # used only if generating a password with a custom username; ignored if existingSecret is set
  existingSecret: ""       # name of a Secret with keys "username" and "password" — mounted at /etc/opscart/auth/

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534   
  seccompProfile:
    type: RuntimeDefault

volumePermissions:
  # Enable when the storage provisioner doesn't honor fsGroup
  # (e.g. minikube hostpath-provisioner, some NFS provisioners).
  # Runs a root init container to chown the data volume.
  enabled: false

nodeSelector: {}

probes:
  readiness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
  liveness:
    path: /healthz
    initialDelaySeconds: 20
    periodSeconds: 30
    failureThreshold: 3
