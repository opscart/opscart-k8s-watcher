# Default values for opscart-watcher.

image:
  repository: ghcr.io/opscart/opscart-dashboard
  tag: "v1.7.0"
  # For local development with a locally-built image (e.g. minikube):
  # the image must be loaded under the EXACT repository:tag rendered by
  # this chart — kubelet does no fuzzy matching with pullPolicy Never.
  #   docker build -t ghcr.io/opscart/opscart-dashboard:dev .
  #   minikube image load ghcr.io/opscart/opscart-dashboard:dev
  #   helm upgrade ... --set image.tag=dev --set image.pullPolicy=Never
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: opscart-dashboard

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

persistence:
  enabled: true
  size: 1Gi
  storageClassName: ""   # empty = cluster default
  existingClaim: ""      # use a pre-created PVC instead of templating one

retentionDays: 90   # resolved incidents/events older than this are pruned each scan cycle; 0 = keep forever

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

args:
  - "--port=8080"
  - "--breakdown=deployment"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534   
  seccompProfile:
    type: RuntimeDefault

volumePermissions:
  # Enable when the storage provisioner doesn't honor fsGroup
  # (e.g. minikube hostpath-provisioner, some NFS provisioners).
  # Runs a root init container to chown the data volume.
  enabled: false

nodeSelector: {}

probes:
  readiness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
  liveness:
    path: /healthz
    initialDelaySeconds: 20
    periodSeconds: 30
    failureThreshold: 3
