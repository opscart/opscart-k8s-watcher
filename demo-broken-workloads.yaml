---
# Namespaces from the article
apiVersion: v1
kind: Namespace
metadata:
  name: team-a
---
apiVersion: v1
kind: Namespace
metadata:
  name: team-b
---
apiVersion: v1
kind: Namespace
metadata:
  name: team-c
---
apiVersion: v1
kind: Namespace
metadata:
  name: platform-shared
---
apiVersion: v1
kind: Namespace
metadata:
  name: data-services
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
---
apiVersion: v1
kind: Namespace
metadata:
  name: auth-services

---
# CrashLoopBackOff pods (article shows 4)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-pipeline
  namespace: team-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-pipeline
  template:
    metadata:
      labels:
        app: data-pipeline
    spec:
      containers:
      - name: app
        image: busybox:latest
        command: ["sh", "-c", "echo 'starting'; sleep 3; exit 1"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-processor
  namespace: team-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-processor
  template:
    metadata:
      labels:
        app: event-processor
    spec:
      containers:
      - name: app
        image: busybox:latest
        command: ["sh", "-c", "sleep 5; exit 1"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: team-c
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: app
        image: busybox:latest
        command: ["sh", "-c", "exit 1"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-handler
  namespace: team-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-handler
  template:
    metadata:
      labels:
        app: notification-handler
    spec:
      containers:
      - name: app
        image: busybox:latest
        command: ["sh", "-c", "sleep 2; exit 1"]

---
# ImagePullBackOff pods (article shows 4)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache-warmer
  namespace: platform-shared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache-warmer
  template:
    metadata:
      labels:
        app: cache-warmer
    spec:
      containers:
      - name: app
        image: nonexistent-registry.example.com/cache-warmer:v1.2.3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-reconciler
  namespace: team-c
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-reconciler
  template:
    metadata:
      labels:
        app: billing-reconciler
    spec:
      containers:
      - name: app
        image: company-registry.local/billing:v2.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-exporter
  namespace: team-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-exporter
  template:
    metadata:
      labels:
        app: report-exporter
    spec:
      containers:
      - name: app
        image: company-registry.local/reports:v1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-logger
  namespace: team-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-logger
  template:
    metadata:
      labels:
        app: audit-logger
    spec:
      containers:
      - name: app
        image: company-registry.local/audit:v3

---
# OOMKilled pods (article shows 3)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregator-job
  namespace: data-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aggregator-job
  template:
    metadata:
      labels:
        app: aggregator-job
    spec:
      containers:
      - name: stress
        image: polinux/stress
        command: ["stress"]
        args: ["--vm", "1", "--vm-bytes", "200M", "--vm-hang", "1"]
        resources:
          limits:
            memory: "64Mi"
          requests:
            memory: "32Mi"

---
# Orphaned PVCs (article shows 2)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgotten-data-backup
  namespace: team-a
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: temp-build-storage
  namespace: team-b
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 50Gi

---
# Some healthy deployments to make scan look realistic
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
  namespace: auth-services
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-api
  template:
    metadata:
      labels:
        app: auth-api
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
